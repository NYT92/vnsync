[package]
name = "vnsync"
version = "0.1.0"
description = "Cross-platform Visual Novel & RPG game save synchronization manager"
authors = ["NYT92 <nyt92@uninbox.me>"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "vnsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
opendal = { version = "0.51", features = ["services-s3", "services-webdav", "services-fs"] }
blake3 = "1.5"
zstd = "0.13"
tar = "0.4"
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.11", features = ["v7", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3.14"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
